<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkItOut – Free Online Calculators</title>
<meta name="description" content="Free, fast calculators for mortgages, loans, savings, BMI, percentages, VAT, age, dates, tips and unit conversions.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#12203a;--mute:#5b6881;--line:#dbe3ef;--acc:#2456e6;--acc-ink:#fff;--soft:#e8eefc;--ad:#fff7df;--adl:#e6cf8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#16203a;--ink:#eaf0ff;--mute:#9aa8c7;--line:#27345a;--acc:#6f95ff;--acc-ink:#0e1524;--soft:#1d2a4d;--ad:#2a2512;--adl:#5c5020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#16203a;--ink:#eaf0ff;--mute:#9aa8c7;--line:#27345a;--acc:#6f95ff;--acc-ink:#0e1524;--soft:#1d2a4d;--ad:#2a2512;--adl:#5c5020;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.15}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-size:1.5rem;font-weight:800;color:var(--ink);text-decoration:none}
.brand b{color:var(--acc)}
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);margin:0 0 8px;font-weight:800;max-width:18ch}
.hero p{margin:0;color:var(--mute);max-width:56ch}
.search{margin:18px 0 6px;width:100%;max-width:420px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.ad{background:var(--ad);border:1px dashed var(--adl);color:var(--mute);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;text-align:center;margin:22px 0;min-height:90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tile:hover{border-color:var(--acc)}
.tile h3{margin:0 0 4px;font-size:1.05rem}
.tile span{color:var(--mute);font-size:.9rem}
.cat{margin:26px 0 0;font-size:1.2rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.2rem)}
.panel .lead{color:var(--mute);margin:0 0 18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.res{margin-top:20px;background:var(--soft);border-radius:12px;padding:16px}
.res .big{font-family:"Bricolage Grotesque",sans-serif;font-size:2.1rem;font-weight:800;color:var(--acc);line-height:1.1}
.res .bl{color:var(--mute);font-size:.9rem;margin-bottom:10px}
.rows{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.row span:first-child{color:var(--mute)}
.row span:last-child{font-weight:600;text-align:right}
.about{margin-top:22px}
.about p{color:var(--mute)}
.side .tile{margin-bottom:10px}
.side h2{font-size:1rem;margin:0 0 10px}
.back{display:inline-block;margin:18px 0 12px;font-weight:600;text-decoration:none}
footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 0 30px;color:var(--mute);font-size:.88rem}
button.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.legal h2{font-size:1.15rem;margin:22px 0 6px}.legal p,.legal li{color:var(--mute)}.legal ul{padding-left:20px}footer nav{margin-bottom:10px}footer nav a{margin-right:16px;font-weight:600}footer p{margin:6px 0}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="#home">WorkIt<b>Out</b></a><button class="theme" id="theme" aria-label="Switch light or dark theme">Theme</button></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><nav aria-label="Legal"><a href="#about">About</a><a href="#contact">Contact</a><a href="#privacy">Privacy Policy</a><a href="#terms">Terms &amp; Disclaimer</a></nav><p>WorkItOut calculators give estimates for general information only and are not financial, medical or legal advice.</p><p>© 2026 WorkItOut</p></div></footer>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const gbp=n=>isFinite(n)?"£"+fmt(n):"–";
const num=(v)=>parseFloat(v)||0;
const today=new Date().toISOString().slice(0,10);

function loanPay(P,r,y){const n=y*12,i=r/1200;return n<=0?0:(i?P*i/(1-Math.pow(1+i,-n)):P/n)}
const LEN={m:1,km:1000,cm:.01,mile:1609.344,yard:.9144,foot:.3048,inch:.0254};
const WT={kg:1,g:.001,tonne:1000,pound:.45359237,ounce:.0283495,stone:6.35029};
const conv=(t)=>({title:t.name,cat:"Converters",desc:t.desc,intro:t.intro,about:t.about,
 fields:[{id:"v",l:"Value",d:1},{id:"f",l:"From",t:"s",o:Object.keys(t.u),d:t.u===LEN?"mile":"pound"},{id:"t",l:"To",t:"s",o:Object.keys(t.u),d:t.u===LEN?"km":"kg"}],
 calc:x=>{const r=num(x.v)*t.u[x.f]/t.u[x.t];return{big:fmt(r,4)+" "+x.t,label:fmt(num(x.v),4)+" "+x.f+" equals",rows:[]}}});

const C={
mortgage:{title:"Mortgage Calculator",cat:"Money",desc:"Monthly repayments on a repayment mortgage.",
 intro:"Work out your monthly mortgage payment, total interest and total cost.",
 about:"This uses the standard repayment formula, where each payment covers interest plus part of the loan. Real mortgages may include fees, and fixed deals reset after a set term, so treat the result as a guide.",
 fields:[{id:"p",l:"Property price (£)",d:300000},{id:"d",l:"Deposit (£)",d:45000},{id:"r",l:"Interest rate (%)",d:4.5},{id:"y",l:"Term (years)",d:25}],
 calc:x=>{const L=num(x.p)-num(x.d),m=loanPay(L,num(x.r),num(x.y)),t=m*num(x.y)*12;return{big:gbp(m),label:"Monthly payment",rows:[["Amount borrowed",gbp(L)],["Loan to value",fmt(num(x.p)?L/num(x.p)*100:0,1)+"%"],["Total interest",gbp(t-L)],["Total repaid",gbp(t)]]}}},
loan:{title:"Loan Calculator",cat:"Money",desc:"Monthly payment and interest on any loan.",
 intro:"See what a personal loan, car loan or finance deal will cost each month.",
 about:"Enter the amount, the yearly interest rate (APR) and how long you will take to repay. Longer terms lower the monthly payment but raise the total interest.",
 fields:[{id:"a",l:"Loan amount (£)",d:10000},{id:"r",l:"Interest rate (%)",d:7.9},{id:"y",l:"Term (years)",d:4}],
 calc:x=>{const m=loanPay(num(x.a),num(x.r),num(x.y)),t=m*num(x.y)*12;return{big:gbp(m),label:"Monthly payment",rows:[["Total interest",gbp(t-num(x.a))],["Total repaid",gbp(t)]]}}},
compound:{title:"Compound Interest Calculator",cat:"Money",desc:"Grow savings with regular deposits.",
 intro:"Project how savings or investments grow when interest earns interest.",
 about:"Interest is compounded monthly and deposits are added at the end of each month. Real returns vary and are not guaranteed.",
 fields:[{id:"s",l:"Starting amount (£)",d:5000},{id:"m",l:"Monthly deposit (£)",d:200},{id:"r",l:"Annual interest (%)",d:5},{id:"y",l:"Years",d:15}],
 calc:x=>{const i=num(x.r)/1200,n=num(x.y)*12;let b=num(x.s);for(let k=0;k<n;k++)b=b*(1+i)+num(x.m);const c=num(x.s)+num(x.m)*n;return{big:gbp(b),label:"Final balance",rows:[["You paid in",gbp(c)],["Interest earned",gbp(b-c)]]}}},
vat:{title:"VAT Calculator",cat:"Money",desc:"Add or remove VAT from a price.",
 intro:"Add VAT to a net price, or take it out of a gross price.",
 about:"The standard UK VAT rate is 20%, with 5% and 0% rates for some goods. Check HMRC for the rate that applies to your product.",
 fields:[{id:"a",l:"Amount (£)",d:100},{id:"r",l:"VAT rate (%)",d:20},{id:"m",l:"Action",t:"s",o:["Add VAT","Remove VAT"],d:"Add VAT"}],
 calc:x=>{const a=num(x.a),r=num(x.r)/100,net=x.m==="Add VAT"?a:a/(1+r),g=net*(1+r);return{big:gbp(x.m==="Add VAT"?g:net),label:x.m==="Add VAT"?"Price including VAT":"Price excluding VAT",rows:[["Net",gbp(net)],["VAT",gbp(g-net)],["Gross",gbp(g)]]}}},
tip:{title:"Tip & Bill Split Calculator",cat:"Everyday",desc:"Tip and share the bill between friends.",
 intro:"Add a tip and split the bill evenly.",
 about:"Tipping 10–15% is typical in UK restaurants, and many add a service charge already, so check your bill first.",
 fields:[{id:"b",l:"Bill (£)",d:80},{id:"t",l:"Tip (%)",d:12.5},{id:"n",l:"People",d:4}],
 calc:x=>{const t=num(x.b)*num(x.t)/100,tot=num(x.b)+t;return{big:gbp(tot/Math.max(1,num(x.n))),label:"Each person pays",rows:[["Tip",gbp(t)],["Total",gbp(tot)]]}}},
percent:{title:"Percentage Calculator",cat:"Everyday",desc:"Percent of, percent change and more.",
 intro:"Three common percentage sums, worked out at once.",
 about:"Use the first result for discounts and tax, the second to see what share one number is of another, and the third for increases and decreases.",
 fields:[{id:"a",l:"Number A",d:25},{id:"b",l:"Number B",d:200}],
 calc:x=>{const a=num(x.a),b=num(x.b);return{big:fmt(a/100*b),label:fmt(a)+"% of "+fmt(b)+" is",rows:[[fmt(a)+" is what % of "+fmt(b),fmt(b?a/b*100:NaN)+"%"],["Change from "+fmt(a)+" to "+fmt(b),fmt(a?(b-a)/Math.abs(a)*100:NaN)+"%"]]}}},
bmi:{title:"BMI Calculator",cat:"Health",desc:"Body mass index from height and weight.",
 intro:"Check your body mass index using metric units.",
 about:"BMI is a rough screening measure and does not account for muscle, age or body shape. Speak to a health professional about your own situation. Adult ranges: under 18.5 underweight, 18.5–24.9 healthy, 25–29.9 overweight, 30 and over obese.",
 fields:[{id:"w",l:"Weight (kg)",d:70},{id:"h",l:"Height (cm)",d:172}],
 calc:x=>{const h=num(x.h)/100,b=num(x.w)/(h*h),c=b<18.5?"Underweight":b<25?"Healthy weight":b<30?"Overweight":"Obese";return{big:fmt(b,1),label:"Your BMI",rows:[["Range",isFinite(b)?c:"–"],["Healthy weight for your height",fmt(18.5*h*h,1)+" – "+fmt(24.9*h*h,1)+" kg"]]}}},
age:{title:"Age Calculator",cat:"Dates",desc:"Exact age in years, months and days.",
 intro:"Find your exact age and when your next birthday is.",
 about:"Enter a date of birth to see your age in years, months and days, plus the total days lived.",
 fields:[{id:"d",l:"Date of birth",type:"date",d:"1990-06-15"}],
 calc:x=>{const b=new Date(x.d),n=new Date();if(isNaN(b))return{big:"–",label:"Enter a date",rows:[]};let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}let nb=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(nb<=n)nb.setFullYear(n.getFullYear()+1);return{big:y+" years",label:y+" years, "+m+" months, "+d+" days",rows:[["Days lived",fmt(Math.floor((n-b)/864e5),0)],["Days to next birthday",fmt(Math.ceil((nb-n)/864e5),0)]]}}},
dates:{title:"Days Between Dates",cat:"Dates",desc:"Count days, weeks and months between two dates.",
 intro:"Count the days between any two dates.",
 about:"The count includes the difference between the two dates, not the start day itself.",
 fields:[{id:"a",l:"Start date",type:"date",d:today},{id:"b",l:"End date",type:"date",d:new Date(Date.now()+90*864e5).toISOString().slice(0,10)}],
 calc:x=>{const a=new Date(x.a),b=new Date(x.b);if(isNaN(a)||isNaN(b))return{big:"–",label:"Enter both dates",rows:[]};const d=Math.round((b-a)/864e5);return{big:fmt(Math.abs(d),0)+" days",label:d<0?"End date is before start date":"Between the dates",rows:[["Weeks",fmt(Math.abs(d)/7,1)],["Months (approx.)",fmt(Math.abs(d)/30.4375,1)]]}}},
length:conv({name:"Length Converter",desc:"Miles, km, feet, inches and more.",intro:"Convert between metric and imperial lengths.",about:"One mile is 1.609344 km and one foot is 30.48 cm. Results show up to four decimal places.",u:LEN}),
weight:conv({name:"Weight Converter",desc:"Kilograms, pounds, stone and more.",intro:"Convert between kilograms, pounds, stone and other units.",about:"One stone is 14 pounds, or about 6.35 kg. Handy for body weight and cooking.",u:WT}),
temp:{title:"Temperature Converter",cat:"Converters",desc:"Celsius, Fahrenheit and Kelvin.",intro:"Convert between Celsius, Fahrenheit and Kelvin.",
 about:"Water freezes at 0°C (32°F) and boils at 100°C (212°F). A typical UK oven at gas mark 4 is about 180°C.",
 fields:[{id:"v",l:"Value",d:180},{id:"f",l:"From",t:"s",o:["Celsius","Fahrenheit","Kelvin"],d:"Celsius"}],
 calc:x=>{const v=num(x.v),c=x.f==="Celsius"?v:x.f==="Fahrenheit"?(v-32)*5/9:v-273.15;return{big:fmt(c*9/5+32,1)+"°F",label:"Fahrenheit",rows:[["Celsius",fmt(c,1)+"°C"],["Kelvin",fmt(c+273.15,1)+" K"]]}}}
};
const CATS=["Money","Everyday","Health","Dates","Converters"];
const AD=(n,h)=>`<div class="ad" style="min-height:${h||90}px" data-slot="${n}">Advert space (${n})<!-- paste ad code here --></div>`;

function tile(k){return `<a class="tile" href="#${k}"><h3>${C[k].title}</h3><span>${C[k].desc}</span></a>`}
function home(){
 document.title="WorkItOut – Free Online Calculators";
 $("#app").innerHTML=`<section class="hero"><h1>Free calculators for everyday sums</h1><p>Mortgages, savings, VAT, BMI, dates and unit conversions. No sign-up, instant results.</p><input class="search" id="q" type="search" placeholder="Search calculators" aria-label="Search calculators"></section>${AD("top banner")}<div id="list"></div>${AD("bottom banner")}`;
 const draw=q=>{let h="";CATS.forEach(c=>{const ks=Object.keys(C).filter(k=>C[k].cat===c&&(C[k].title+C[k].desc).toLowerCase().includes(q));if(ks.length)h+=`<h2 class="cat">${c}</h2><div class="grid">${ks.map(tile).join("")}</div>`});$("#list").innerHTML=h||"<p>No calculators match that search.</p>"};
 draw("");$("#q").oninput=e=>draw(e.target.value.toLowerCase());
}
function page(k){
 const c=C[k];document.title=c.title+" – WorkItOut";
 const f=c.fields.map(x=>x.t==="s"?`<div><label for="${x.id}">${x.l}</label><select id="${x.id}">${x.o.map(o=>`<option${o===x.d?" selected":""}>${o}</option>`).join("")}</select></div>`:`<div><label for="${x.id}">${x.l}</label><input id="${x.id}" ${x.type==="date"?'type="date"':'type="number" inputmode="decimal" step="any"'} value="${x.d}"></div>`).join("");
 const more=Object.keys(C).filter(z=>z!==k&&C[z].cat===c.cat).concat(Object.keys(C).filter(z=>z!==k&&C[z].cat!==c.cat)).slice(0,4);
 $("#app").innerHTML=`<a class="back" href="#home">← All calculators</a>${AD("top banner")}<div class="layout"><div><div class="panel"><h1>${c.title}</h1><p class="lead">${c.intro}</p><div class="fields">${f}</div><div class="res" aria-live="polite"><div class="big" id="big"></div><div class="bl" id="bl"></div><div class="rows" id="rows"></div></div></div>${AD("in-content",250)}<div class="panel about"><h2>About this calculator</h2><p>${c.about}</p></div></div><aside class="side">${AD("sidebar",250)}<h2>More calculators</h2>${more.map(tile).join("")}</aside></div>`;
 const run=()=>{const v={};c.fields.forEach(x=>v[x.id]=$("#"+x.id).value);const r=c.calc(v);$("#big").textContent=r.big;$("#bl").textContent=r.label;$("#rows").innerHTML=r.rows.map(a=>`<div class="row"><span>${a[0]}</span><span>${a[1]}</span></div>`).join("")};
 c.fields.forEach(x=>{$("#"+x.id).addEventListener("input",run);$("#"+x.id).addEventListener("change",run)});run();
}
const UP='Last updated: 20 November 2026.';
const LEG={
about:{t:'About',h:`<h1>About WorkItOut</h1><p class='lead'>Free, fast calculators for everyday sums.</p><p>WorkItOut offers simple online calculators for money, health, dates and unit conversions. There is nothing to download and no sign-up. Type in your numbers and the answer appears straight away.</p><h2>How it is paid for</h2><p>The site is free to use and is supported by advertising.</p><h2>How accurate are the results?</h2><p>The calculators use standard formulas and are meant to give you a good estimate. They are not a substitute for professional advice, and real products such as mortgages and loans can include fees and conditions the calculators do not cover. See our <a href='#terms'>Terms &amp; Disclaimer</a>.</p><h2>Spotted a mistake?</h2><p>Please <a href='#contact'>tell us</a>. We are happy to correct errors and to hear which calculators you would like to see next.</p>`},
contact:{t:'Contact',h:`<h1>Contact</h1><p class='lead'>We would love to hear from you.</p><p>Email: <a href='mailto:hello@workitout.uk'>hello@workitout.uk</a></p><p>You can write to us about a mistake in a calculator, a suggestion for a new one, or a question about this website. We read every message, although we cannot always reply quickly.</p><p>We cannot give personal financial, medical or legal advice by email.</p>`},
privacy:{t:'Privacy Policy',h:`<h1>Privacy Policy</h1><p class='lead'>${UP}</p><h2>Who we are</h2><p>WorkItOut (workitout.uk) is a free calculator website run by [YOUR FULL NAME] in the United Kingdom. For privacy questions, contact us at <a href='mailto:hello@workitout.uk'>hello@workitout.uk</a>.</p><h2>The numbers you enter</h2><p>Everything you type into a calculator is processed in your own browser. We do not send it to a server, store it or see it.</p><h2>Information collected automatically</h2><p>This website is delivered through third-party services, including GitHub (hosting) and Cloudflare (domain and network services). Like most websites, these providers may process technical information such as your IP address, browser type and the pages requested, in order to deliver the site and keep it secure.</p><h2>Cookies and advertising</h2><p>We do not set our own cookies. We show, or may in future show, adverts provided by third parties such as Google. These advertisers may use cookies or similar technologies to show ads, limit how often you see them and measure how well they work. Where the law requires it, we will ask for your consent before these are used, and you can change your choice at any time. You can also block or delete cookies in your browser settings. To learn how Google uses data from sites that use its services, see its privacy and advertising pages.</p><h2>Analytics</h2><p>If we add website analytics in future, we will update this policy to say what is collected.</p><h2>Your rights</h2><p>Under UK data protection law you can ask to see, correct or delete personal data we hold about you, and object to how it is used. Email us to make a request. You also have the right to complain to the Information Commissioner’s Office (ico.org.uk).</p><h2>Changes</h2><p>We may update this policy from time to time. The date at the top shows when it last changed.</p>`},
terms:{t:'Terms & Disclaimer',h:`<h1>Terms &amp; Disclaimer</h1><p class='lead'>${UP}</p><h2>General information only</h2><p>The calculators and content on WorkItOut are provided for general information and illustration. Results are estimates and are not financial, tax, medical, legal or other professional advice. Please speak to a qualified professional before making important decisions.</p><h2>No guarantee of accuracy</h2><p>We aim to keep the calculators correct and up to date, but we do not promise that results are accurate, complete or suitable for your circumstances. Rates, tax rules and thresholds change, and real products may have fees and conditions that are not included.</p><h2>Limit of liability</h2><p>To the extent the law allows, we are not responsible for any loss arising from your use of this website or from relying on its results. Nothing in these terms limits liability that cannot legally be limited, such as for death or personal injury caused by negligence, or for fraud.</p><h2>Links and adverts</h2><p>The site may contain adverts and links to other websites. We do not control them and are not responsible for their content or practices.</p><h2>Changes and governing law</h2><p>We may change these terms at any time. They are governed by the laws of England and Wales.</p>`}};
function legal(k){const p=LEG[k];document.title=p.t+' – WorkItOut';$('#app').innerHTML=`<a class='back' href='#home'>← All calculators</a><div class='panel legal'>${p.h}</div>`}
function route(){const k=location.hash.slice(1);if(LEG[k])legal(k);else if(k&&C[k])page(k);else home();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
$("#theme").onclick=()=>{const d=document.documentElement,dark=matchMedia("(prefers-color-scheme:dark)").matches;const cur=d.dataset.theme||(dark?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark"};
</script>
</body>
</html>
